name: Develop to Release Validation

on:
  pull_request:
    branches:
      - 'release/**'

permissions:
  pull-requests: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-source-branch:
    name: Validate Source Branch
    runs-on: ubuntu-latest

    steps:
      - name: Check if source is develop
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "develop" ]; then
            echo "ERROR: Pull Requests to the release branch must come from the develop branch"
            echo "Current Branch: ${{ github.event.pull_request.base.ref }}"
            exit 1
          fi
          echo "SUCCESS: Valid source branch: develop"

  mandatory-dev-tests:
    name: Mandatory Tests (dev profile)
    runs-on: ubuntu-latest
    needs: validate-source-branch
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application for dev
        run: |
          mvn clean package \
            -P dev \
            -Dspring.profiles.active=dev \
            --no-transfer-progress

      - name: Run mandatory dev tests
        id: dev-tests
        run: |
          mvn test \
            -P dev \
            -Dspring.profiles.active=dev \
            --no-transfer-progress

          TEST_RESULT=$?

          if [ $TEST_RESULT -eq 0 ]; then
            echo "SUCCESS: All dev tests passed!"
            echo "dev_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Dev tests failed, the pipeline cannot continue..."
            echo "dev_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload JAR artifact for QA
        if: env.dev_tests_passed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar-qa-pr-${{ github.event.number }}
          path: target/*.jar
          retention-days: 3

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-test-results-pr-${{ github.event.number }}
          path: target/surefire-reports/

  build-qa-docker-image:
    name: Build & Push QA Docker Image
    runs-on: ubuntu-latest
    needs: mandatory-dev-tests
    if: needs.mandatory-dev-tests.outputs.dev_tests_passed == 'true'
    permissions:
      packages: write
      contents: read

    outputs:
      docker_image: ${{ steps.save-image-info.outputs.docker_image }}
      package_url: ${{ steps.save-image-info.outputs.package_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar-qa-pr-${{ github.event.number }}
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=qa-pr-${{ github.event.number }}
            type=raw,value=qa-${{ github.sha }}
            type=raw,value=qa-release-$(echo ${{ github.head_ref }} | sed 's/release\///')
          labels: |
            maintainer=${{ github.actor }}
            profile=qa
            pr-number=${{ github.event.number }}
            commit-sha=${{ github.sha }}
            environment=quality-assurance
            release-branch=${{ github.head_ref }}

      - name: Build and push QA Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.qa
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=target/*.jar

      - name: Save image information
        id: save-image-info
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:qa-pr-${{ github.event.number }}"
          echo "docker_image=$IMAGE_TAG" >> $GITHUB_OUTPUT

          PACKAGE_URL="https://github.com/${{ github.repository }}/pkgs/container/$(echo ${{ env.IMAGE_NAME }} | sed 's/\//%2F/g')"
          echo "package_url=$PACKAGE_URL" >> $GITHUB_OUTPUT

          echo "SUCCESS: QA Docker image built and pushed: $IMAGE_TAG"
          echo "Package URL: $PACKAGE_URL"

  optional-qa-container-tests:
    name: Optional QA Container Tests
    runs-on: ubuntu-latest
    needs: build-qa-docker-image
    continue-on-error: true
    env:
      QA_IMAGE_TAG: ${{ needs.build-qa-docker-image.outputs.docker_image }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull QA Docker image
        run: |
          echo "Pulling QA image: ${{ env.QA_IMAGE_TAG }}"
          docker pull ${{ env.QA_IMAGE_TAG }}

      - name: Start QA container
        run: |
          echo "Starting QA container..."
          docker run -d \
            --name app-qa-pr-${{ github.event.number }} \
            -p 8081:8080 \
            -e SPRING_PROFILES_ACTIVE=qa \
            ${{ env.QA_IMAGE_TAG }}

          echo "Waiting for QA application to start..."
          sleep 30

          echo "Checking container status..."
          docker ps | grep app-qa-pr-${{ github.event.number }}

          echo "Performing health check..."
          curl -f http://localhost:8081/actuator/health || echo "WARNING: QA health check failed"

      - name: Run QA integration tests
        id: qa-integration-tests
        run: |
          set +e

          echo "Running QA integration tests..."
          mvn test \
            -P qa \
            -Dtest="*QATest*,*IntegrationTest*" \
            -Dspring.profiles.active=qa \
            -Dservice.url=http://localhost:8081 \
            --no-transfer-progress

          QA_RESULT=$?

          if [ $QA_RESULT -eq 0 ]; then
            echo "SUCCESS: QA integration tests passed"
            echo "qa_integration_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: QA integration tests failed (non-blocking for QA deploy)"
            echo "qa_integration_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run performance tests
        id: performance-tests
        run: |
          set +e

          echo "Running performance tests..."
          mvn test \
            -P qa \
            -Dtest="*PerformanceTest*" \
            -Dspring.profiles.active=qa \
            -Dservice.url=http://localhost:8081 \
            --no-transfer-progress

          PERF_RESULT=$?

          if [ $PERF_RESULT -eq 0 ]; then
            echo "SUCCESS: Performance tests passed"
            echo "performance_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Performance tests failed (non-blocking)"
            echo "performance_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run security tests
        id: security-tests
        run: |
          set +e

          echo "Running security tests..."
          mvn test \
            -P qa \
            -Dtest="*SecurityTest*" \
            -Dspring.profiles.active=qa \
            -Dservice.url=http://localhost:8081 \
            --no-transfer-progress

          SECURITY_RESULT=$?

          if [ $SECURITY_RESULT -eq 0 ]; then
            echo "SUCCESS: Security tests passed"
            echo "security_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Security tests failed (non-blocking)"
            echo "security_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Run load tests
        id: load-tests
        run: |
          set +e

          echo "Running load tests..."
          mvn test \
            -P qa \
            -Dtest="*LoadTest*" \
            -Dspring.profiles.active=qa \
            -Dservice.url=http://localhost:8081 \
            --no-transfer-progress

          LOAD_RESULT=$?

          if [ $LOAD_RESULT -eq 0 ]; then
            echo "SUCCESS: Load tests passed"
            echo "load_tests_passed=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: Load tests failed (non-blocking)"
            echo "load_tests_passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate QA test report
        if: always()
        run: |
          echo "QA Test Results Summary:"
          echo "========================"
          echo "Integration Tests: ${{ steps.qa-integration-tests.outputs.qa_integration_tests_passed || 'NOT_RUN' }}"
          echo "Performance Tests: ${{ steps.performance-tests.outputs.performance_tests_passed || 'NOT_RUN' }}"
          echo "Security Tests: ${{ steps.security-tests.outputs.security_tests_passed || 'NOT_RUN' }}"
          echo "Load Tests: ${{ steps.load-tests.outputs.load_tests_passed || 'NOT_RUN' }}"
          echo "========================"

      - name: Cleanup QA containers
        if: always()
        run: |
          docker stop app-qa-pr-${{ github.event.number }} || true
          docker rm app-qa-pr-${{ github.event.number }} || true

  pr-comment-report-release:
    name: Create Release PR Report
    runs-on: ubuntu-latest
    needs: [mandatory-dev-tests, optional-qa-container-tests]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Generate release PR report
        uses: actions/github-script@v7
        env:
          DEV_TESTS_PASSED: ${{ needs.mandatory-dev-tests.outputs.dev_tests_passed == 'true' }}
          QA_INTEGRATION_PASSED: ${{ needs.optional-qa-container-tests.outputs.qa_integration_tests_passed == 'true' }}
          PERFORMANCE_PASSED: ${{ needs.optional-qa-container-tests.outputs.performance_tests_passed == 'true' }}
          SECURITY_PASSED: ${{ needs.optional-qa-container-tests.outputs.security_tests_passed == 'true' }}
          LOAD_PASSED: ${{ needs.optional-qa-container-tests.outputs.load_tests_passed == 'true' }}
          DOCKER_IMAGE: ${{ needs.build-qa-docker-image.outputs.docker_image }}
          PACKAGE_URL: ${{ needs.build-qa-docker-image.outputs.package_url }}
        with:
          script: |
            const { owner, repo, number } = context.issue;

            const devPassed = process.env.DEV_TESTS_PASSED === 'true';
            const qaIntegrationPassed = process.env.QA_INTEGRATION_PASSED === 'true';
            const performancePassed = process.env.PERFORMANCE_PASSED === 'true';
            const securityPassed = process.env.SECURITY_PASSED === 'true';
            const loadPassed = process.env.LOAD_PASSED === 'true';
            const dockerImage = process.env.DOCKER_IMAGE;
            const packageUrl = process.env.PACKAGE_URL;

            let report = "## RELEASE VALIDATION REPORT\n\n";

            report += "### BLOCKING TESTS (Dev Profile)\n";
            if (devPassed) {
              report += "**ALL PASSED** - Ready to deploy to QA environment\n\n";
            } else {
              report += "**TESTS FAILED** - Not ready to deploy to QA environment\n\n";
            }

            if (devPassed && dockerImage) {
              report += "### QA DOCKER IMAGE BUILT\n";
              report += `- **Image Tag:** \`${dockerImage}\`\n`;
              report += `- **Package URL:** [View Package](${packageUrl})\n\n`;

              report += "### QA ENVIRONMENT TESTS (Non-blocking)\n";

              const qaTests = [
                { name: "Integration Tests", passed: qaIntegrationPassed },
                { name: "Performance Tests", passed: performancePassed },
                { name: "Security Tests", passed: securityPassed },
                { name: "Load Tests", passed: loadPassed }
              ];

              let failedQaTests = 0;

              qaTests.forEach(test => {
                if (test.passed !== undefined) {
                  const status = test.passed ? 'PASSED' : 'FAILED';
                  const icon = test.passed ? '✅' : '❌';
                  report += `${icon} **${test.name}:** ${status}\n`;
                  if (!test.passed) failedQaTests++;
                } else {
                  report += `**${test.name}:** NOT EXECUTED\n`;
                }
              });

              if (failedQaTests > 0) {
                report += `\n**ALERT:** ${failedQaTests} QA test(s) failed.\n`;
                report += "It is strongly recommended to fix these issues before merging to production.\n";
                report += "The deploy to QA can proceed, but there will be known problems.\n";
              }
            } else if (devPassed) {
              report += "### QA TESTS\n";
              report += "**NOT EXECUTED** - Docker image build failed\n";
            }

            report += "\n---\n*Report generated at " + new Date().toISOString() + "*";

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('RELEASE VALIDATION REPORT')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: report
              });
            }

            const state = devPassed ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'Release Validation',
              description: devPassed ?
                'Ready for QA deployment' :
                'Blocked: Dev tests failed'
            });
